<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Histórico LANZA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="bg-shape bg-shape-a"></div>
  <div class="bg-shape bg-shape-b"></div>

  <main class="app-shell">
    <header class="hero">
      <h1>Histórico LANZA</h1>
      <p>Este visor muestra históricos ya generados. Para crear o actualizar el histórico usa la opción de "Guardar histórico" en la página principal.</p>
      <div class="hero-actions">
        <a href="index.html" class="btn btn-secondary">Ir a análisis</a>
        <a href="config.html" class="btn btn-secondary">Configurar colores</a>
      </div>
      <p id="historicoStatus" class="hint"></p>
      <button id="clearHistoricosBtn" style="margin-top: 10px; padding: 5px 10px;">Limpiar Históricos Guardados</button>
    </header>

    <section class="panel">
      <h2>Por Negocio</h2>
      <div class="filters-grid">
        <label class="field">
          <span>Mes</span>
          <select id="mesSelectNegocio" multiple size="5">
            <option disabled selected>Cargando...</option>
          </select>
          <small class="hint">Podés seleccionar varios meses con Ctrl/Cmd + click.</small>
        </label>
        <label class="field">
          <span>Negocio</span>
          <select id="negocioSelect">
            <option value="">Todos</option>
          </select>
        </label>
      </div>
      <div id="negocioMetrics" class="cards"></div>
    </section>

    <section class="panel">
      <h2>Por OC</h2>
      <div class="filters-grid">
        <label class="field">
          <span>Mes</span>
          <select id="mesSelectOC">
            <option disabled selected>Cargando...</option>
          </select>
        </label>
        <label class="field">
          <span>OC</span>
          <select id="ocSelect">
            <option value="">Todos</option>
          </select>
        </label>
      </div>
      <div id="ocMetrics" class="cards"></div>
    </section>

  </main>

  <script>
    let historicos = {};
    const chartInstances = new Map();

    function toNumber(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : 0;
    }

    function buildMonthLabel(monthKey) {
      const [month, year] = String(monthKey || '').split('_');
      return month && year ? `${month} ${year}` : monthKey;
    }

    function getReportRows(historico) {
      return Array.isArray(historico?.reportRows) ? historico.reportRows : [];
    }

    function getSelectedMonths(selectElementId) {
      const select = document.getElementById(selectElementId);
      const values = Array.from(select.selectedOptions || []).map((option) => option.value).filter(Boolean);

      // En select simple, o cuando no hay selección explícita, usa el valor actual.
      if (values.length) {
        return values;
      }

      return select.value ? [select.value] : [];
    }

    function averageMetrics(metricsList) {
      if (!metricsList.length) {
        return { ns_15_dias: 0, ns: 0, cancelado: 0 };
      }

      const acc = metricsList.reduce((sum, current) => {
        sum.ns_15_dias += toNumber(current.ns_15_dias);
        sum.ns += toNumber(current.ns);
        sum.cancelado += toNumber(current.cancelado);
        return sum;
      }, { ns_15_dias: 0, ns: 0, cancelado: 0 });

      return {
        ns_15_dias: acc.ns_15_dias / metricsList.length,
        ns: acc.ns / metricsList.length,
        cancelado: acc.cancelado / metricsList.length,
      };
    }

    function metricsFromReportRows(rows) {
      if (!rows.length) {
        return { ns_15_dias: 0, ns: 0, cancelado: 0 };
      }

      const totals = rows.reduce((sum, row) => {
        sum.ns_15_dias += toNumber(row.ns15 ?? row.ns_15_dias);
        sum.ns += toNumber(row.nivelServicio ?? row.ns);
        sum.cancelado += toNumber(row.pctCancelado ?? row.cancelado);
        return sum;
      }, { ns_15_dias: 0, ns: 0, cancelado: 0 });

      return {
        ns_15_dias: totals.ns_15_dias / rows.length,
        ns: totals.ns / rows.length,
        cancelado: totals.cancelado / rows.length,
      };
    }

    function getNegocios(historico) {
      const rows = getReportRows(historico);
      if (rows.length) {
        return Array.from(new Set(rows.map((row) => row.negocio).filter(Boolean))).sort();
      }

      const negocioEntries = historico?.negocios && typeof historico.negocios === 'object'
        ? Object.keys(historico.negocios)
        : [];
      return negocioEntries.sort();
    }

    function getOCs(historico) {
      const rows = getReportRows(historico);
      let ocValues = [];

      if (rows.length) {
        ocValues = Array.from(new Set(rows.map((row) => row.oc).filter(Boolean)));
      } else if (Array.isArray(historico?.ocs)) {
        ocValues = historico.ocs.map((oc) => oc.id).filter(Boolean);
      }

      return ocValues.sort((a, b) => {
        const regex = /lanza_(\d+)/i;
        const aMatch = String(a).match(regex);
        const bMatch = String(b).match(regex);
        if (aMatch && bMatch) {
          const aNum = Number(aMatch[1]);
          const bNum = Number(bMatch[1]);
          if (aNum !== bNum) return aNum - bNum;
        }
        return String(a).localeCompare(String(b));
      });
    }

    function populateNegocioOptionsForSelectedMonth() {
      const negocioSelect = document.getElementById('negocioSelect');
      const mesSelectNegocio = document.getElementById('mesSelectNegocio');
      const previousValue = negocioSelect.value;
      const selectedMonths = getSelectedMonths('mesSelectNegocio');
      const negociosSet = new Set();

      selectedMonths.forEach((monthKey) => {
        const selectedHistorico = historicos[monthKey];
        getNegocios(selectedHistorico).forEach((negocio) => negociosSet.add(negocio));
      });

      const negocios = Array.from(negociosSet).sort();

      negocioSelect.innerHTML = '<option value="">Todos</option>' + negocios.map(n => `<option value="${n}">${n}</option>`).join('');
      if (previousValue && negocios.includes(previousValue)) {
        negocioSelect.value = previousValue;
      }
    }

    function populateOCOptionsForSelectedMonth() {
      const ocSelect = document.getElementById('ocSelect');
      const mesSelectOC = document.getElementById('mesSelectOC');
      const previousValue = ocSelect.value;
      const selectedMes = mesSelectOC.value;
      const selectedHistorico = historicos[selectedMes];
      const sortedOCs = getOCs(selectedHistorico);

      ocSelect.innerHTML = '<option value="">Todos</option>' + sortedOCs.map(oc => `<option value="${oc}">${oc}</option>`).join('');
      if (previousValue && sortedOCs.includes(previousValue)) {
        ocSelect.value = previousValue;
      }
    }

    async function loadHistoricos() {
      // Cargar desde localStorage
      let loaded = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('historico_')) {
          const raw = localStorage.getItem(key);
          if (!raw) continue;
          try {
            const data = JSON.parse(raw);
            const monthYearKey = key.replace('historico_', '');
            historicos[monthYearKey] = data;
            loaded++;
            console.log('Cargado desde localStorage:', monthYearKey, data);
          } catch (error) {
            console.warn('Omitiendo histórico inválido:', key, error);
          }
        }
      }

      const status = document.getElementById('historicoStatus');
      if (!loaded) {
        status.textContent = 'No hay históricos guardados aún. Carga planes en la página principal y guarda un histórico.';
        document.getElementById('mesSelectNegocio').innerHTML = '<option disabled>No hay meses disponibles</option>';
        document.getElementById('negocioSelect').innerHTML = '<option value="">Todos</option>';
        document.getElementById('mesSelectOC').innerHTML = '<option disabled>No hay meses disponibles</option>';
        document.getElementById('ocSelect').innerHTML = '<option value="">Todos</option>';
        renderMetrics('negocioMetrics', { ns_15_dias: 0, ns: 0, cancelado: 0 });
        renderMetrics('ocMetrics', { ns_15_dias: 0, ns: 0, cancelado: 0 });
        return;
      }

      status.textContent = `Históricos cargados: ${loaded} mes(es).`;
      renderNegocios();
      renderOCsSection();
    }

    function renderNegocios() {
      const negocioSelect = document.getElementById('negocioSelect');
      const mesSelectNegocio = document.getElementById('mesSelectNegocio');
      
      // Poblar meses
      mesSelectNegocio.innerHTML = '';
      Object.keys(historicos).sort().forEach(key => {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = buildMonthLabel(key);
        mesSelectNegocio.appendChild(option);
      });
      // Seleccionar primer mes por defecto
      if (mesSelectNegocio.options.length > 0) {
        mesSelectNegocio.options[0].selected = true;
      }

      // Poblar negocios
      populateNegocioOptionsForSelectedMonth();
      
      console.log('Históricos cargados:', historicos);
      console.log('Negocios detectados:', Array.from(document.getElementById('negocioSelect').options).map((o) => o.value).filter(Boolean));
      updateNegocioMetrics();
    }

    function renderOCsSection() {
      const ocSelect = document.getElementById('ocSelect');
      const mesSelectOC = document.getElementById('mesSelectOC');
      
      // Poblar meses
      mesSelectOC.innerHTML = '';
      Object.keys(historicos).sort().forEach(key => {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = buildMonthLabel(key);
        mesSelectOC.appendChild(option);
      });
      // Seleccionar primer mes por defecto
      if (mesSelectOC.options.length > 0) {
        mesSelectOC.selectedIndex = 0;
      }

      // Poblar OCs
      populateOCOptionsForSelectedMonth();
      updateOCMetrics();
    }

    function updateNegocioMetrics() {
      const negocioSelect = document.getElementById('negocioSelect');
      const selectedMonths = getSelectedMonths('mesSelectNegocio');
      const selectedNegocio = negocioSelect.value;

      if (!selectedMonths.length) {
        renderMetrics('negocioMetrics', { ns_15_dias: 0, ns: 0, cancelado: 0 });
        return;
      }

      const reportRowsBucket = [];
      const fallbackMetricsBucket = [];

      selectedMonths.forEach((monthKey) => {
        const historico = historicos[monthKey];
        if (!historico) {
          return;
        }

        const rows = getReportRows(historico);
        if (rows.length) {
          const filteredRows = selectedNegocio ? rows.filter((row) => row.negocio === selectedNegocio) : rows;
          reportRowsBucket.push(...filteredRows);
          return;
        }

        const negocioEntries = historico.negocios && typeof historico.negocios === 'object' ? historico.negocios : {};
        if (selectedNegocio) {
          fallbackMetricsBucket.push({
            ns_15_dias: toNumber(negocioEntries[selectedNegocio]?.ns_15_dias),
            ns: toNumber(negocioEntries[selectedNegocio]?.ns),
            cancelado: toNumber(negocioEntries[selectedNegocio]?.cancelado),
          });
        } else {
          Object.values(negocioEntries).forEach((item) => {
            fallbackMetricsBucket.push({
              ns_15_dias: item?.ns_15_dias,
              ns: item?.ns,
              cancelado: item?.cancelado,
            });
          });
        }
      });

      const metrics = reportRowsBucket.length
        ? metricsFromReportRows(reportRowsBucket)
        : averageMetrics(fallbackMetricsBucket);

      renderMetrics('negocioMetrics', metrics);
    }

    function updateOCMetrics() {
      const mesSelectOC = document.getElementById('mesSelectOC');
      const ocSelect = document.getElementById('ocSelect');
      const selectedMes = mesSelectOC.value;
      const selectedOC = ocSelect.value;

      const historico = historicos[selectedMes];
      if (!historico) {
        renderMetrics('ocMetrics', { ns_15_dias: 0, ns: 0, cancelado: 0 });
        return;
      }

      const rows = getReportRows(historico);
      let metrics;

      if (rows.length) {
        const filteredRows = selectedOC ? rows.filter((row) => row.oc === selectedOC) : rows;
        metrics = metricsFromReportRows(filteredRows);
      } else {
        const ocList = Array.isArray(historico.ocs) ? historico.ocs : [];
        const filteredOcs = selectedOC ? ocList.filter((item) => item.id === selectedOC) : ocList;
        const metricsList = filteredOcs.map((item) => ({
          ns_15_dias: item.ns_15_dias,
          ns: item.ns,
          cancelado: item.cancelado,
        }));
        metrics = averageMetrics(metricsList);
      }

      renderMetrics('ocMetrics', metrics);
    }

    function renderMetrics(containerId, metrics) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      const labels = {
        ns_15_dias: 'NS 15 Días (Promedio)',
        ns: 'NS (Promedio)',
        cancelado: 'Cancelado (Promedio)'
      };
      Object.keys(metrics).forEach(key => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `<h3>${labels[key]}</h3><canvas id="${containerId}_${key}"></canvas>`;
        container.appendChild(div);
        renderGauge(`${containerId}_${key}`, metrics[key]);
      });
    }

    function renderGauge(canvasId, value) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      const safeValue = Math.max(0, Math.min(100, toNumber(value)));

      if (chartInstances.has(canvasId)) {
        chartInstances.get(canvasId).destroy();
      }

      const chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          datasets: [{
            data: [safeValue, 100 - safeValue],
            backgroundColor: [safeValue >= 90 ? 'green' : safeValue >= 70 ? 'yellow' : 'red', '#e0e0e0'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false }
          },
          cutout: '70%'
        },
        plugins: [{
          id: 'centerText',
          beforeDraw: (chart) => {
            const { ctx, chartArea: { left, right, top, bottom, width, height } } = chart;
            ctx.save();
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'black';
            ctx.fillText(`${safeValue.toFixed(1)}%`, left + width / 2, top + height / 2);
            ctx.restore();
          }
        }]
      });

      chartInstances.set(canvasId, chart);
    }

    document.getElementById('mesSelectNegocio').addEventListener('change', () => {
      populateNegocioOptionsForSelectedMonth();
      updateNegocioMetrics();
    });
    document.getElementById('negocioSelect').addEventListener('change', updateNegocioMetrics);
    document.getElementById('mesSelectOC').addEventListener('change', () => {
      populateOCOptionsForSelectedMonth();
      updateOCMetrics();
    });
    document.getElementById('ocSelect').addEventListener('change', updateOCMetrics);

    document.getElementById('clearHistoricosBtn').addEventListener('click', () => {
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const key = localStorage.key(i);
        if (key.startsWith('historico_')) {
          localStorage.removeItem(key);
        }
      }
      historicos = {};
      alert('Históricos guardados eliminados.');
      loadHistoricos();
    });

    loadHistoricos();
  </script>
</body>
</html>
