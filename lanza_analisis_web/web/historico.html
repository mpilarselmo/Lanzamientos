<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Histórico LANZA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="bg-shape bg-shape-a"></div>
  <div class="bg-shape bg-shape-b"></div>

  <main class="app-shell">
    <header class="hero">
      <h1>Histórico LANZA</h1>
      <p>Este visor muestra históricos ya generados. Para crear o actualizar el histórico usa la opción de "Guardar histórico" en la página principal.</p>
      <p id="historicoStatus" class="hint"></p>
      <button id="clearHistoricosBtn" style="margin-top: 10px; padding: 5px 10px;">Limpiar Históricos Guardados</button>
    </header>

    <section class="panel">
      <h2>Por Negocio</h2>
      <div class="filters-grid">
        <label class="field">
          <span>Mes</span>
          <select id="mesSelectNegocio">
            <option disabled selected>Cargando...</option>
          </select>
        </label>
        <label class="field">
          <span>Negocio</span>
          <select id="negocioSelect">
            <option value="">Todos</option>
          </select>
        </label>
      </div>
      <div id="negocioMetrics" class="cards"></div>
    </section>

    <section class="panel">
      <h2>Por OC</h2>
      <div class="filters-grid">
        <label class="field">
          <span>Mes</span>
          <select id="mesSelectOC">
            <option disabled selected>Cargando...</option>
          </select>
        </label>
        <label class="field">
          <span>OC</span>
          <select id="ocSelect">
            <option value="">Todos</option>
          </select>
        </label>
      </div>
      <div id="ocMetrics" class="cards"></div>
    </section>

  </main>

  <script>
    let historicos = {};

    async function loadHistoricos() {
      // Cargar desde localStorage
      let loaded = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('historico_')) {
          const raw = localStorage.getItem(key);
          if (!raw) continue;
          try {
            const data = JSON.parse(raw);
            const monthYearKey = key.replace('historico_', '');
            historicos[monthYearKey] = data;
            loaded++;
            console.log('Cargado desde localStorage:', monthYearKey, data);
          } catch (error) {
            console.warn('Omitiendo histórico inválido:', key, error);
          }
        }
      }

      const status = document.getElementById('historicoStatus');
      if (!loaded) {
        status.textContent = 'No hay históricos guardados aún. Carga planes en la página principal y guarda un histórico.';
        document.getElementById('mesSelectNegocio').innerHTML = '<option disabled>No hay meses disponibles</option>';
        document.getElementById('negocioSelect').innerHTML = '<option value="">Todos</option>';
        document.getElementById('mesSelectOC').innerHTML = '<option disabled>No hay meses disponibles</option>';
        document.getElementById('ocList').innerHTML = '<p class="hint">No hay OCs disponibles.</p>';
        return;
      }

      status.textContent = `Históricos cargados: ${loaded} mes(es).`;
      renderNegocios();
      renderOCsSection();
    }

    function renderNegocios() {
      const negocioSelect = document.getElementById('negocioSelect');
      const mesSelectNegocio = document.getElementById('mesSelectNegocio');
      
      // Poblar meses
      mesSelectNegocio.innerHTML = '';
      Object.keys(historicos).forEach(key => {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = key.replace(/_/g, ' ');
        mesSelectNegocio.appendChild(option);
      });
      // Seleccionar primer mes por defecto
      if (mesSelectNegocio.options.length > 0) {
        mesSelectNegocio.selectedIndex = 0;
      }

      // Poblar negocios
      const negocios = new Set();
      Object.values(historicos).forEach(h => {
        if (h.reportRows && Array.isArray(h.reportRows)) {
          h.reportRows.forEach(row => {
            if (row.negocio) negocios.add(row.negocio);
          });
        }
      });
      negocioSelect.innerHTML = '<option value="">Todos</option>' + Array.from(negocios).sort().map(n => `<option value="${n}">${n}</option>`).join('');
      
      console.log('Históricos cargados:', historicos);
      console.log('Negocios detectados:', Array.from(negocios));
      updateNegocioMetrics();
    }

    function renderOCsSection() {
      const ocSelect = document.getElementById('ocSelect');
      const mesSelectOC = document.getElementById('mesSelectOC');
      
      // Poblar meses
      mesSelectOC.innerHTML = '';
      Object.keys(historicos).forEach(key => {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = key.replace(/_/g, ' ');
        mesSelectOC.appendChild(option);
      });
      // Seleccionar primer mes por defecto
      if (mesSelectOC.options.length > 0) {
        mesSelectOC.selectedIndex = 0;
      }

      // Poblar OCs
      const allOCs = new Set();
      Object.values(historicos).forEach(h => {
        if (h.reportRows && Array.isArray(h.reportRows)) {
          h.reportRows.forEach(row => {
            if (row.oc) allOCs.add(row.oc);
          });
        }
      });
      
      const sortedOCs = Array.from(allOCs).sort((a, b) => {
        const regex = /lanza_(\d+)/i;
        const aMatch = a.match(regex);
        const bMatch = b.match(regex);
        if (aMatch && bMatch) {
          const aNum = Number(aMatch[1]);
          const bNum = Number(bMatch[1]);
          if (aNum !== bNum) return aNum - bNum;
        }
        return a.localeCompare(b);
      });
      
      ocSelect.innerHTML = '<option value="">Todos</option>' + sortedOCs.map(oc => `<option value="${oc}">${oc}</option>`).join('');
      updateOCMetrics();
    }

    function aggregateFromReportRows(reportRows, selectedNegocio = null) {
      const metrics = { ns_15_dias: 0, facturado: 0, cancelado: 0 };
      let count = 0;

      reportRows.forEach(row => {
        if (selectedNegocio && row.negocio !== selectedNegocio) return;
        const ns15 = Number(row.ns15) || 0;
        const facturado = Number(row.pctAvance) || 0;
        const cancelado = Number(row.pctCancelado) || 0;
        metrics.ns_15_dias += ns15;
        metrics.facturado += facturado;
        metrics.cancelado += cancelado;
        count++;
      });

      if (count === 0) return null;
      return {
        ns_15_dias: metrics.ns_15_dias / count,
        ns: metrics.facturado / count,
        facturado: metrics.facturado / count,
        cancelado: metrics.cancelado / count,
      };
    }

    function updateNegocioMetrics() {
      const mesSelect = document.getElementById('mesSelectNegocio');
      const negocioSelect = document.getElementById('negocioSelect');
      const selectedMes = mesSelect.value;
      const selectedNegocio = negocioSelect.value;
      const metrics = { ns_15_dias: 0, ns: 0, cancelado: 0 };
      let count = 0;

      const historico = historicos[selectedMes];
      if (!historico) {
        renderMetrics('negocioMetrics', metrics);
        return;
      }

      if (historico.reportRows && Array.isArray(historico.reportRows)) {
        const filtered = selectedNegocio 
          ? historico.reportRows.filter(row => row.negocio === selectedNegocio)
          : historico.reportRows;
        
        filtered.forEach(row => {
          const ns15 = Number(row.ns15) || 0;
          const nsValue = Number(row.nivelServicio) || 0;
          const cancelado = Number(row.pctCancelado) || 0;
          metrics.ns_15_dias += ns15;
          metrics.ns += nsValue;
          metrics.cancelado += cancelado;
          count++;
        });
      }

      if (count > 0) {
        Object.keys(metrics).forEach(k => metrics[k] /= count);
      }
      renderMetrics('negocioMetrics', metrics);
    }

    function updateOCMetrics() {
      const mesSelectOC = document.getElementById('mesSelectOC');
      const ocSelect = document.getElementById('ocSelect');
      const selectedMes = mesSelectOC.value;
      const selectedOC = ocSelect.value;
      const metrics = { ns_15_dias: 0, ns: 0, cancelado: 0 };
      let count = 0;

      const historico = historicos[selectedMes];
      if (!historico) {
        renderMetrics('ocMetrics', metrics);
        return;
      }

      if (historico.reportRows && Array.isArray(historico.reportRows)) {
        const filtered = selectedOC 
          ? historico.reportRows.filter(row => row.oc === selectedOC)
          : historico.reportRows;
        
        filtered.forEach(row => {
          const ns15 = Number(row.ns15) || 0;
          const nsValue = Number(row.nivelServicio) || 0;
          const cancelado = Number(row.pctCancelado) || 0;
          metrics.ns_15_dias += ns15;
          metrics.ns += nsValue;
          metrics.cancelado += cancelado;
          count++;
        });
      }

      if (count > 0) {
        Object.keys(metrics).forEach(k => metrics[k] /= count);
      }
      renderMetrics('ocMetrics', metrics);
    }

    function renderMetrics(containerId, metrics) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      const labels = {
        ns_15_dias: 'NS 15 Días (Promedio)',
        ns: 'NS (Promedio)',
        cancelado: 'Cancelado (Promedio)'
      };
      Object.keys(metrics).forEach(key => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `<h3>${labels[key]}</h3><canvas id="${containerId}_${key}"></canvas>`;
        container.appendChild(div);
        renderGauge(`${containerId}_${key}`, metrics[key]);
      });
    }

    function renderGauge(canvasId, value) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      new Chart(ctx, {
        type: 'doughnut',
        data: {
          datasets: [{
            data: [value, 100 - value],
            backgroundColor: [value >= 90 ? 'green' : value >= 70 ? 'yellow' : 'red', '#e0e0e0'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false }
          },
          cutout: '70%'
        },
        plugins: [{
          id: 'centerText',
          beforeDraw: (chart) => {
            const { ctx, chartArea: { left, right, top, bottom, width, height } } = chart;
            ctx.save();
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'black';
            ctx.fillText(`${value.toFixed(1)}%`, left + width / 2, top + height / 2);
            ctx.restore();
          }
        }]
      });
    }

    document.getElementById('mesSelectNegocio').addEventListener('change', updateNegocioMetrics);
    document.getElementById('negocioSelect').addEventListener('change', updateNegocioMetrics);
    document.getElementById('mesSelectOC').addEventListener('change', updateOCMetrics);
    document.getElementById('ocSelect').addEventListener('change', updateOCMetrics);

    document.getElementById('clearHistoricosBtn').addEventListener('click', () => {
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const key = localStorage.key(i);
        if (key.startsWith('historico_')) {
          localStorage.removeItem(key);
        }
      }
      alert('Históricos guardados eliminados. Recarga la página para cargar desde archivos.');
    });

    loadHistoricos();
  </script>
</body>
</html>
