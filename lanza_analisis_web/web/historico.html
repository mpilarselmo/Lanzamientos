<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Histórico LANZA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="bg-shape bg-shape-a"></div>
  <div class="bg-shape bg-shape-b"></div>

  <main class="app-shell">
    <header class="hero">
      <h1>Histórico LANZA</h1>
      <p>Este visor muestra históricos ya generados. Para crear o actualizar el histórico usa la opción de "Guardar histórico" en la página principal.</p>
      <p id="historicoStatus" class="hint"></p>
    </header>

    <section class="panel">
      <h2>Por Negocio</h2>
      <div class="filters-grid">
        <label class="field">
          <span>Mes(es)</span>
          <select id="mesSelectNegocio" multiple>
            <option disabled selected>Cargando...</option>
          </select>
        </label>
        <label class="field">
          <span>Negocio</span>
          <select id="negocioSelect">
            <option value="">Todos</option>
          </select>
        </label>
      </div>
      <div id="negocioMetrics" class="cards"></div>
    </section>

    <section class="panel">
      <h2>Por OC</h2>
      <div class="filters-grid">
        <label class="field">
          <span>Mes(es)</span>
          <select id="mesSelectOC" multiple>
            <option disabled selected>Cargando...</option>
          </select>
        </label>
      </div>
      <div id="ocList" class="oc-list"></div>
      <div id="ocMetrics" class="cards"></div>
    </section>

  </main>

  <script>
    let historicos = {};

    async function loadHistoricos() {
      // Cargar desde localStorage
      let loaded = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('historico_')) {
          const raw = localStorage.getItem(key);
          if (!raw) continue;
          try {
            const data = JSON.parse(raw);
            const monthYearKey = key.replace('historico_', '');
            historicos[monthYearKey] = data;
            loaded++;
          } catch (error) {
            console.warn('Omitiendo histórico inválido:', key, error);
          }
        }
      }

      if (!loaded) {
        const monthNames = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
        for (const month of monthNames) {
          try {
            const response = await fetch(`historicos/historico_${month}.json`);
            if (!response.ok) continue;
            const data = await response.json();
            historicos[month] = data;
            loaded++;
          } catch (error) {
            console.warn(`No se pudo cargar historico_${month}.json`, error);
          }
        }
      }
      
      const status = document.getElementById('historicoStatus');
      if (!loaded) {
        status.textContent = 'No hay históricos guardados aún. Carga planes en la página principal y guarda un histórico.';
        document.getElementById('mesSelectNegocio').innerHTML = '<option disabled>No hay meses disponibles</option>';
        document.getElementById('negocioSelect').innerHTML = '<option value="">Todos</option>';
        document.getElementById('mesSelectOC').innerHTML = '<option disabled>No hay meses disponibles</option>';
        document.getElementById('ocList').innerHTML = '<p class="hint">No hay OCs disponibles.</p>';
        return;
      }

      status.textContent = `Históricos cargados: ${loaded} mes(es).`;
      renderNegocios();
      renderOCs();
    }

    function renderNegocios() {
      const negocioSelect = document.getElementById('negocioSelect');
      const mesSelectNegocio = document.getElementById('mesSelectNegocio');
      
      // Poblar meses
      mesSelectNegocio.innerHTML = '';
      Object.keys(historicos).forEach(key => {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = key.replace(/_/g, ' ');
        option.selected = true;
        mesSelectNegocio.appendChild(option);
      });

      // Poblar negocios
      const negocios = new Set();
      Object.values(historicos).forEach(h => {
        Object.keys(h.negocios || {}).forEach(n => negocios.add(n));
      });
      negocioSelect.innerHTML = '<option value="">Todos</option>' + Array.from(negocios).map(n => `<option value="${n}">${n}</option>`).join('');
      
      console.log('Históricos cargados:', historicos);
      console.log('Negocios detectados:', Array.from(negocios));
      updateNegocioMetrics();
    }

    function renderOCs() {
      const mesSelectOC = document.getElementById('mesSelectOC');
      
      // Poblar meses
      mesSelectOC.innerHTML = '';
      Object.keys(historicos).forEach(key => {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = key.replace(/_/g, ' ');
        option.selected = true;
        mesSelectOC.appendChild(option);
      });

      updateOCList();
    }

    function updateOCList() {
      const mesSelectOC = document.getElementById('mesSelectOC');
      const selectedMeses = Array.from(mesSelectOC.selectedOptions).map(o => o.value);
      const ocList = document.getElementById('ocList');
      const allOCs = [];
      
      selectedMeses.forEach(mes => {
        if (historicos[mes]) {
          allOCs.push(...(historicos[mes].ocs || []));
        }
      });
      
      allOCs.sort((a, b) => {
        const regex = /lanza_(\d+)/i;
        const aMatch = a.id.match(regex);
        const bMatch = b.id.match(regex);
        if (aMatch && bMatch) {
          const aNum = Number(aMatch[1]);
          const bNum = Number(bMatch[1]);
          if (aNum !== bNum) return aNum - bNum;
        }
        return a.id.localeCompare(b.id);
      });

      if (!allOCs.length) {
        ocList.innerHTML = '<p class="hint">No hay OCs disponibles en los meses seleccionados.</p>';
      } else {
        ocList.innerHTML = allOCs.map(oc => `
          <label class="oc-item">
            <input type="checkbox" value="${oc.id}" ${oc.incluido ? 'checked' : ''} onchange="updateOCMetrics()">
            ${oc.id} (${oc.negocio})
          </label>
        `).join('');
      }
      updateOCMetrics();
    }

    function updateNegocioMetrics() {
      const mesSelect = document.getElementById('mesSelectNegocio');
      const negocioSelect = document.getElementById('negocioSelect');
      const selectedMeses = Array.from(mesSelect.selectedOptions).map(o => o.value);
      const selectedNegocio = negocioSelect.value;
      const metrics = { ns_15_dias: 0, ns: 0, facturado: 0, cancelado: 0 };
      let count = 0;

      console.log('updateNegocioMetrics:', { selectedMeses, selectedNegocio, historicoKeys: Object.keys(historicos) });

      selectedMeses.forEach(mes => {
        if (historicos[mes] && historicos[mes].negocios) {
          console.log(`  Mes ${mes}:`, historicos[mes].negocios);
          if (selectedNegocio && historicos[mes].negocios[selectedNegocio]) {
            const n = historicos[mes].negocios[selectedNegocio];
            metrics.ns_15_dias += n.ns_15_dias;
            metrics.ns += n.ns;
            metrics.facturado += n.facturado;
            metrics.cancelado += n.cancelado;
            count++;
          } else if (!selectedNegocio) {
            Object.values(historicos[mes].negocios).forEach(n => {
              metrics.ns_15_dias += n.ns_15_dias;
              metrics.ns += n.ns;
              metrics.facturado += n.facturado;
              metrics.cancelado += n.cancelado;
              count++;
            });
          }
        }
      });

      console.log('Métricas calculadas:', { metrics, count });
      if (count > 0) {
        Object.keys(metrics).forEach(k => metrics[k] /= count);
      }
      renderMetrics('negocioMetrics', metrics);
    }

    function updateOCMetrics() {
      const checkboxes = document.querySelectorAll('#ocList input:checked');
      const selectedOCs = Array.from(checkboxes).map(cb => cb.value);
      const metrics = { ns_15_dias: 0, ns: 0, facturado: 0, cancelado: 0 };
      let count = 0;

      Object.values(historicos).forEach(h => {
        (h.ocs || []).forEach(oc => {
          if (selectedOCs.includes(oc.id)) {
            metrics.ns_15_dias += oc.ns_15_dias;
            metrics.ns += oc.ns;
            metrics.facturado += oc.facturado;
            metrics.cancelado += oc.cancelado;
            count++;
          }
        });
      });

      if (count > 0) {
        Object.keys(metrics).forEach(k => metrics[k] /= count);
      }
      renderMetrics('ocMetrics', metrics);
    }

    function renderMetrics(containerId, metrics) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      const labels = {
        ns_15_dias: 'NS 15 Días',
        ns: 'NS',
        facturado: 'Facturado',
        cancelado: 'Cancelado'
      };
      Object.keys(metrics).forEach(key => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `<h3>${labels[key]}</h3><canvas id="${containerId}_${key}"></canvas>`;
        container.appendChild(div);
        renderGauge(`${containerId}_${key}`, metrics[key]);
      });
    }

    function renderGauge(canvasId, value) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      new Chart(ctx, {
        type: 'doughnut',
        data: {
          datasets: [{
            data: [value, 100 - value],
            backgroundColor: [value >= 90 ? 'green' : value >= 70 ? 'yellow' : 'red', '#e0e0e0'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false }
          },
          cutout: '70%'
        },
        plugins: [{
          id: 'centerText',
          beforeDraw: (chart) => {
            const { ctx, chartArea: { left, right, top, bottom, width, height } } = chart;
            ctx.save();
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'black';
            ctx.fillText(`${value.toFixed(1)}%`, left + width / 2, top + height / 2);
            ctx.restore();
          }
        }]
      });
    }

    document.getElementById('mesSelectNegocio').addEventListener('change', updateNegocioMetrics);
    document.getElementById('negocioSelect').addEventListener('change', updateNegocioMetrics);
    document.getElementById('mesSelectOC').addEventListener('change', updateOCList);

    loadHistoricos();
</body>
</html>
