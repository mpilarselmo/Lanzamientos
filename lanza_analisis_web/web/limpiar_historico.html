<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Limpiar Histórico LANZA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <h1>Limpiar Histórico</h1>
      <p>Eliminando datos de histórico en localStorage...</p>
      <p id="status" class="hint"></p>
      <p>Una vez terminado, cierra esta ventana y vuelve a abrir la app principal.</p>
    </header>
  </main>

  <script>
    const status = document.getElementById('status');
    let removed = 0;

    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith('historico_')) {
        localStorage.removeItem(key);
        removed++;
        i--; // ajustar índice porque se eliminó una clave
      }
    }

    status.textContent = removed > 0
      ? `Historico limpiado: ${removed} entrada(s) eliminadas.`
      : 'No se encontraron entradas de histórico en localStorage.';
  </script>
</body>
</html>
